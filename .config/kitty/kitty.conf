# Theme
include theme.conf

# Font
font_family                     CaskaydiaCove Nerd Font Propo
bold_font                       auto
italic_font                     auto
bold_italic_font                auto
font_size                       13

# Window
remember_window_size            no
window_padding_width            10
dynamic_background_opacity      no

# Window decorations (keep your current preference)
hide_window_decorations         yes

# Cursor
cursor_shape                    underline
cursor_blink_interval           0.53

# Selection
copy_on_select                  clipboard

# General
enable_audio_bell               no
shell_integration               disabled
disable_ligatures               yes
url_style                       curly
confirm_os_window_close         0
sync_to_monitor                 no
repaint_delay                   8
input_delay                     3
cursor_trail                    3

# Optional (remove if you don't use transparency)
background_opacity              0.9

# Scrollbar
scrollbar_handle_opacity        0
scrollbar_track_opacity         0
scrollbar_track_hover_opacity   0

# Reload Kitty without restarting
allow_remote_control            yes
